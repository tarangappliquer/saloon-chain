networks:
  saloon-network:
    driver: bridge

services:
  # =========================================================================
  # SALOON API BACKEND SERVICE
  # =========================================================================
  saloonchains-backend:
    image: ${DOCKERHUB_USERNAME:-tarangappliquer1606}/saloonchains-backend:latest
    pull_policy: always
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saloonchains-backend
    networks:
      - saloon-network
    ports:
      - "5127:5127"
    environment:
      ASPNETCORE_URLS: "http://+:5127"
      ConnectionStrings__SaloonDb: "${SALOON_DB_CONN_STRING:-Server=saloonchains-sqlserver;Database=SaloonChainDb;User Id=sa;Password=SaloonChains_Dev123!;TrustServerCertificate=True;}"
      Redis__ConnectionString: "saloonchains-redis:6379"
      Redis__Enabled: "true"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-SaloonChains_Production_Or_Dev_Secret_Signing_Key_32_Bytes_Min}"
      Jwt__Issuer: "SaloonApi"
      Jwt__Audience: "SaloonClients"
      Cors__AllowedOrigins__0: "http://198.245.65.114:5173"
      Cors__AllowedOrigins__1: "http://198.245.65.114:5174"
      Cors__AllowedOrigins__2: "http://localhost:8080"
      Cors__AllowedOrigins__3: "http://localhost:8081"
      Serilog__MinimumLevel__Default: "${LOG_LEVEL:-Information}"
      Serilog__MinimumLevel__Override__Microsoft: "${MICROSOFT_LOG_LEVEL:-Warning}"
      Portals__AdminPortalUrl: "http://198.245.65.114:5173"
      Portals__ClientPortalUrl: "http://198.245.65.114:5174"
    volumes:
      # Physical folder on host machine mounted to /app/uploads inside container
      - ${UPLOADS_DIR:-./uploads}:/app/uploads
      # Physical folder on host machine mounted to /app/Logs inside container
      - ${LOGS_DIR:-./logs}:/app/Logs
    depends_on:
      saloonchains-redis:
        condition: service_healthy
      saloonchains-sqlserver:
        condition: service_healthy
    restart: unless-stopped

  # =========================================================================
  # ADMIN PORTAL FRONTEND (REACT 19 + VITE + NGINX)
  # =========================================================================
  saloonchains-adminportal:
    image: ${DOCKERHUB_USERNAME:-tarangappliquer1606}/saloonchains-adminportal:latest
    pull_policy: always
    build:
      context: ./frontend
      dockerfile: apps/adminportal/Dockerfile
      args:
        VITE_API_BASE_URL: "http://198.245.65.114:5127"
    container_name: saloonchains-adminportal
    networks:
      - saloon-network
    ports:
      - "5173:80"
    depends_on:
      - saloonchains-backend
    restart: unless-stopped

  # =========================================================================
  # CLIENT PORTAL FRONTEND (REACT 19 + VITE + NGINX)
  # =========================================================================
  saloonchains-clientportal:
    image: ${DOCKERHUB_USERNAME:-tarangappliquer1606}/saloonchains-clientportal:latest
    pull_policy: always
    build:
      context: ./frontend
      dockerfile: apps/clientportal/Dockerfile
      args:
        VITE_API_BASE_URL: "http://198.245.65.114:5127"
    container_name: saloonchains-clientportal
    networks:
      - saloon-network
    ports:
      - "5174:80"
    depends_on:
      - saloonchains-backend
    restart: unless-stopped

  # =========================================================================
  # REDIS CACHE SERVICE
  # =========================================================================
  saloonchains-redis:
    image: redis:8-alpine
    container_name: saloonchains-redis
    networks:
      - saloon-network
    ports:
      - "6379:6379"
    volumes:
      # Physical folder on host machine mounted to /data inside Redis container
      - ${REDIS_DATA_DIR:-./docker-data/redis}:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # =========================================================================
  # WATCHTOWER CONTAINER AUTO-UPDATER
  # Monitors Docker Hub for new image pushes every 60 seconds.
  # Automatically pulls updated images & restarts server containers.
  # =========================================================================
  saloonchains-watchtower:
    image: containrrr/watchtower
    container_name: saloonchains-watchtower
    networks:
      - saloon-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount docker config for private Docker Hub repository access (if needed)
      - ${HOME}/.docker/config.json:/config.json:ro
    command: --interval 60 --cleanup
    restart: unless-stopped

  # =========================================================================
  # IN-CONTAINER SQL SERVER
  # =========================================================================
  saloonchains-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: saloonchains-sqlserver
    user: "0:0"
    networks:
      - saloon-network
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SaloonChains_Dev123!"
    ports:
      - "1433:1433"
    volumes:
      # Physical folder on host machine mounted to /var/opt/mssql inside SQL container
      - ${SQL_DATA_DIR:-./docker-data/mssql}:/var/opt/mssql
      - ./db:/db:ro
    entrypoint: [ "/bin/bash", "-c", "/db/init-db.sh & /opt/mssql/bin/sqlservr" ]
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P \"SaloonChains_Dev123!\" -C -Q \"IF EXISTS (SELECT * FROM sys.databases WHERE name = N'SaloonChainDb' AND state_desc = 'ONLINE') SELECT 1 ELSE EXIT 1\" || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 45s
    restart: unless-stopped
