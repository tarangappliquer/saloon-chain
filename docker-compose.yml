networks:
  saloon-network:
    name: saloon-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  # =========================================================================
  # SALOON API BACKEND SERVICE
  # =========================================================================
  saloonchains-backend:
    image: ${DOCKERHUB_USERNAME:-tarangappliquer1606}/saloonchains-backend:latest
    pull_policy: always
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saloonchains-backend
    networks:
      saloon-network:
        ipv4_address: 172.28.0.10
    ports:
      - "5127:5127"
    environment:
      ASPNETCORE_URLS: "http://+:5127"
      ConnectionStrings__SaloonDb: "${SALOON_DB_CONN_STRING:-Host=${POSTGRES_HOST:-host.docker.internal};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-SaloonChainDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-SaloonChains_Dev123!;};Ssl Mode=${POSTGRES_SSL_MODE:-Prefer};Trust Server Certificate=true;}"
      Redis__ConnectionString: "saloonchains-redis:6379"
      Redis__Enabled: "${BACKEND_REDIS_ENABLED:-true}"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-SaloonChains_Production_Or_Dev_Secret_Signing_Key_32_Bytes_Min}"
      Jwt__Issuer: "SaloonApi"
      Jwt__Audience: "SaloonClients"
      Cors__AllowedOrigins: "${BACKEND_CORS_ORIGINS:-http://198.245.65.114:5173,http://198.245.65.114:5174,http://localhost:8080,http://localhost:8081}"
      Serilog__MinimumLevel__Default: "${LOG_LEVEL:-Information}"
      Serilog__MinimumLevel__Override__Microsoft: "${MICROSOFT_LOG_LEVEL:-Warning}"
      CLEAN_LOGS_ON_STARTUP: "${BACKEND_CLEAN_LOGS_ON_STARTUP:-false}"
      CONSOLE_LOGS: "${BACKEND_CONSOLE_LOGS:-false}"
      Portals__AdminPortalUrl: "${BACKEND_PORTALS_ADMIN_URL:-http://198.245.65.114:5173}"
      Portals__ClientPortalUrl: "${BACKEND_PORTALS_CLIENT_URL:-http://198.245.65.114:5174}"
      Email__Enable: "${BACKEND_EMAIL_ENABLE:-false}"
      Email__SmtpHost: "${BACKEND_EMAIL_SMTP_HOST:-smtp.gmail.com}"
      Email__SmtpPort: "${BACKEND_EMAIL_SMTP_PORT:-465}"
      Email__Username: "${BACKEND_EMAIL_USERNAME:-tarangkalaria55@gmail.com}"
      Email__Password: "${BACKEND_EMAIL_PASSWORD:-}"
      Email__UseSsl: "${BACKEND_EMAIL_USE_SSL:-true}"
      Email__FromAddress: "${BACKEND_EMAIL_FROM_ADDRESS:-tarangkalaria55@gmail.com}"
      Email__FromName: "${BACKEND_EMAIL_FROM_NAME:-Saloon Chains}"
      Email__DeveloperEmail: "${BACKEND_EMAIL_DEVELOPER_EMAIL:-tarangkalaria55@gmail.com}"
      Stripe__PublishableKey: "${BACKEND_STRIPE_PUBLISHABLE_KEY:-pk_test_sample}"
      Stripe__SecretKey: "${BACKEND_STRIPE_SECRET_KEY:-}"
      Stripe__WebhookSecret: "${BACKEND_STRIPE_WEBHOOK_SECRET:-}"
      Storage__Provider: "${BACKEND_STORAGE_PROVIDER:-Local}"
      Storage__BasePath: "${BACKEND_STORAGE_BASE_PATH:-uploads}"
      Storage__S3__BucketName: "${BACKEND_STORAGE_S3_BUCKET_NAME:-}"
      Storage__S3__AccessKey: "${BACKEND_STORAGE_S3_ACCESS_KEY:-}"
      Storage__S3__SecretKey: "${BACKEND_STORAGE_S3_SECRET_KEY:-}"
      Storage__S3__Region: "${BACKEND_STORAGE_S3_REGION:-us-east-1}"
      Storage__S3__ServiceUrl: "${BACKEND_STORAGE_S3_SERVICE_URL:-}"
      Storage__S3__PublicUrlPrefix: "${BACKEND_STORAGE_S3_PUBLIC_URL_PREFIX:-}"
      Auth__RequireEmailVerification: "${BACKEND_AUTH_REQUIRE_EMAIL_VERIFICATION:-true}"
      Auth__SetPasswordExpiryHours: "${BACKEND_AUTH_SET_PASSWORD_EXPIRY_HOURS:-72}"
      Auth__ForgotPasswordExpiryHours: "${BACKEND_AUTH_FORGOT_PASSWORD_EXPIRY_HOURS:-1}"
      Auth__EmailChangeExpiryHours: "${BACKEND_AUTH_EMAIL_CHANGE_EXPIRY_HOURS:-24}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Physical folder on host machine mounted to /app/uploads inside container
      - ${UPLOADS_DIR:-./uploads}:/app/uploads
      # Physical folder on host machine mounted to /app/Logs inside container
      - ${LOGS_DIR:-./logs}:/app/Logs
    depends_on:
      saloonchains-redis:
        condition: service_healthy
    restart: unless-stopped

  # =========================================================================
  # ADMIN PORTAL FRONTEND (REACT 19 + VITE + NGINX)
  # =========================================================================
  saloonchains-adminportal:
    image: ${DOCKERHUB_USERNAME:-tarangappliquer1606}/saloonchains-adminportal:latest
    pull_policy: always
    build:
      context: ./frontend
      dockerfile: apps/adminportal/Dockerfile
      args:
        VITE_API_BASE_URL: "${FRONTEND_ADMIN_VITE_API_BASE_URL:-http://198.245.65.114:5127}"
        VITE_ENABLE_THEME_TOGGLE: "${FRONTEND_ADMIN_VITE_ENABLE_THEME_TOGGLE:-false}"
        VITE_CLIENT_PORTAL_URL: "${FRONTEND_ADMIN_VITE_CLIENT_PORTAL_URL:-http://198.245.65.114:5174}"
    container_name: saloonchains-adminportal
    networks:
      - saloon-network
    ports:
      - "5173:80"
    depends_on:
      - saloonchains-backend
    restart: unless-stopped

  # =========================================================================
  # CLIENT PORTAL FRONTEND (REACT 19 + VITE + NGINX)
  # =========================================================================
  saloonchains-clientportal:
    image: ${DOCKERHUB_USERNAME:-tarangappliquer1606}/saloonchains-clientportal:latest
    pull_policy: always
    build:
      context: ./frontend
      dockerfile: apps/clientportal/Dockerfile
      args:
        VITE_API_BASE_URL: "${FRONTEND_CUSTOMER_VITE_API_BASE_URL:-http://198.245.65.114:5127}"
        VITE_ENABLE_THEME_TOGGLE: "${FRONTEND_CUSTOMER_VITE_ENABLE_THEME_TOGGLE:-false}"
        VITE_ADMIN_PORTAL_URL: "${FRONTEND_CUSTOMER_VITE_ADMIN_PORTAL_URL:-http://198.245.65.114:5173}"
    container_name: saloonchains-clientportal
    networks:
      - saloon-network
    ports:
      - "5174:80"
    depends_on:
      - saloonchains-backend
    restart: unless-stopped

  # =========================================================================
  # REDIS CACHE SERVICE
  # =========================================================================
  saloonchains-redis:
    image: redis:8-alpine
    container_name: saloonchains-redis
    networks:
      - saloon-network
    ports:
      - "6379:6379"
    volumes:
      # Physical folder on host machine mounted to /data inside Redis container
      - ${REDIS_DATA_DIR:-./docker-data/redis}:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # =========================================================================
  # WATCHTOWER CONTAINER AUTO-UPDATER
  # Monitors Docker Hub for new image pushes every 60 seconds.
  # Automatically pulls updated images & restarts server containers.
  # =========================================================================
  saloonchains-watchtower:
    image: containrrr/watchtower
    container_name: saloonchains-watchtower
    networks:
      - saloon-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount docker config for private Docker Hub repository access (if needed)
      - ${HOME}/.docker/config.json:/config.json:ro
    command: --interval 60 --cleanup
    restart: unless-stopped
