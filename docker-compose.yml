services:
  saloonchains-redis:
    image: redis:8-alpine
    container_name: saloonchains-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # saloonchains-sqlserver:
  #   image: mcr.microsoft.com/mssql/server:2022-latest
