packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10 moved these out of package.json's "pnpm" field.
peerDependencyRules:
  ignoreMissing:
    - '@uppy/core'
  allowedVersions:
    # @uppy/image-editor@4 declares a conservative peer of @uppy/core@^5, but
    # its 4.x line runs fine on the @uppy/core@4 the rest of the stack uses.
    '@uppy/image-editor>@uppy/core': '4'